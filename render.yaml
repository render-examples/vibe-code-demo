# The factory's own gateway and database.
#
# This is not the Blueprint that deploys generated apps — that one lives at the
# root of APPS_REPO and is written by app/blueprint.ts.
#
# The Workflows service is not created here: Render Workflows services are
# created separately with `npm run start:workflows`. Give it the same
# DATABASE_URL (the database's internal connection string) as the gateway.

databases:
  - name: vibe-factory-db
    plan: basic-256mb

services:
  - type: web
    name: vibe-factory-gateway
    runtime: docker
    plan: starter
    # Applies app/schema.sql before any new instance serves traffic.
    preDeployCommand: npm run db:migrate
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vibe-factory-db
          property: connectionString
      - key: APPS_REPO
        sync: false
      - key: FACTORY_API_KEY
        sync: false
      - key: UI_USERNAME
        sync: false
      - key: UI_PASSWORD
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        sync: false
      # Used by the Render SDK to start the workflow task.
      - key: RENDER_API_KEY
        sync: false
